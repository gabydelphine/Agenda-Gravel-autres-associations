
name: Veille Gravel Toulouse

'on':
  schedule:
    - cron: '15 5 * * *'
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer le lecteur PDF
        run: pip install pypdf

      - name: Executer la veille
        if: github.event.schedule != '0 7 * * 0'
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python veille_gravel.py

      - name: Executer la veille Ultra gravel
        if: github.event.schedule != '0 7 * * 0'
        continue-on-error: true
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python veille_ultra.py

      - name: Envoyer le recapitulatif
        if: github.event.schedule == '0 7 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: python notification_email.py

      - name: Sauvegarder les observations
        if: github.event.schedule != '0 7 * * 0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille-resultats.json inventaire-gravel.json cache/communes-zone.json $(ls ultra-veille.json cache/geo-ultra.json 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour veille gravel"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Sauvegarder l'historique des emails
        if: success() && (github.event.schedule == '0 7 * * 0' || github.event_name == 'workflow_dispatch')
        run: |
          if [ -f veille-notifications.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add veille-notifications.json
            if ! git diff --cached --quiet; then
              git commit -m "Mise a jour historique notifications gravel"
              git pull --rebase --autostash origin main
              git push
            fi
          fi
