<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÔGravel — Prochaines sorties</title><style>body{font:16px system-ui,Arial;background:#f8f6f1;color:#26312b;margin:0}.wrap{max-width:650px;margin:auto;padding:24px 18px}h1{font-size:1.6rem;color:#873c46}h2{font-size:1rem;color:#873c46;margin-top:28px;text-transform:uppercase}.item{background:white;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001;display:flex;gap:14px}.date{color:#873c46;font-weight:800;min-width:78px}.title{font-weight:700}.place,.small{color:#647169;font-size:.9rem;margin-top:4px}a{color:#873c46}footer{margin:30px 0;font-size:.85rem;color:#647169}</style></head><body><main class="wrap"><h1>🚴 ÔGravel — Prochaines sorties</h1><p>Les rendez-vous officiels à venir, en un coup d'œil.</p><div id="events">Chargement du calendrier…</div><footer>Source : <a href="https://ogravel.com/calendrier/">calendrier officiel ÔGravel</a><div id="updated"></div>Les horaires et précisions sont communiqués par l'association.</footer></main><script>const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];fetch('./events.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('Lecture impossible');return r.json()}).then(data=>{let html='',last='';for(const e of data.events){const d=new Date(e.date+'T12:00:00'),key=d.getFullYear()+'-'+d.getMonth();if(key!==last){html+='<h2>'+months[d.getMonth()]+' '+d.getFullYear()+'</h2>';last=key}html+='<div class="item"><div class="date">'+d.getDate()+' '+months[d.getMonth()].slice(0,3)+'.</div><div><div class="title">'+escapeHTML(e.title)+'</div><div class="place">'+escapeHTML(e.location)+'</div></div></div>'}document.getElementById('events').innerHTML=html||'Aucune sortie à venir.';document.getElementById('updated').textContent='Dernière mise à jour : '+data.updated}).catch(()=>document.getElementById('events').textContent='Calendrier momentanément indisponible. Consultez le site officiel.');function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
