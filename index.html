<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Gravel — 100 km autour de Toulouse</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7f3;color:#19332a;margin:0}header{background:#193d31;color:white;padding:32px 18px}main{max-width:760px;margin:0 auto;padding:22px 16px}h1{margin:0 0 8px;font-size:1.8rem}header p{margin:0;opacity:.88}.month{margin:26px 0 12px;font-size:1.3rem;text-transform:capitalize}.event{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #193d3112;border-left:5px solid #86b94b}.date{font-weight:700;color:#49722c}.event h3{margin:8px 0}.small{color:#52645b;font-size:.9rem}a{color:#1d654b}.notice{background:#fff;border-radius:12px;padding:18px;margin:16px 0}footer{padding:22px 0;color:#52645b;font-size:.9rem}</style></head><body><header><main><h1>🚴 Agenda Gravel — 100 km autour de Toulouse</h1><p>Événements gravel annoncés autour de Toulouse • toutes fédérations</p></main></header><main><div id="status" class="small">Chargement des événements…</div><div id="events"></div><footer>Sources indiquées sur chaque fiche événement<p>Vérifiez les détails auprès des organisateurs avant de vous déplacer.</p></footer></main><script>const months=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'}),full=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});function date(s){return new Date(s+'T12:00:00Z')}async function load(){let s=document.querySelector('#status'),out=document.querySelector('#events');try{let r=await fetch('events.json?v='+Date.now());if(!r.ok)throw Error('Fichier introuvable');let data=await r.json(),today=new Date().toISOString().slice(0,10),list=(data.events||[]).filter(e=>(e.end_date||e.date)>=today).sort((a,b)=>a.date.localeCompare(b.date));s.textContent='Dernière actualisation : '+(data.updated||'non renseignée')+' · '+list.length+' événement(s) confirmé(s)';if(!list.length){out.innerHTML='<div class="notice">Aucune sortie gravel future confirmée pour le moment. Consultez les agendas officiels ci-dessous.</div>';return}let previous='';for(let e of list){let month=months.format(date(e.date));if(month!==previous){let h=document.createElement('h2');h.className='month';h.textContent=month;out.append(h);previous=month}let article=document.createElement('article');article.className='event';let d=document.createElement('div');d.className='date';d.textContent=full.format(date(e.date))+(e.end_date?' au '+full.format(date(e.end_date)):'');article.append(d);let title=document.createElement('h3');title.textContent=e.title;article.append(title);if(e.location){let p=document.createElement('p');p.textContent='📍 '+e.location;article.append(p)}if(e.details){let p=document.createElement('p');p.textContent=e.details;article.append(p)}if(e.source){let a=document.createElement('a');a.href=e.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Source / renseignements ↗';article.append(a)}out.append(article)}}catch(e){s.textContent='Impossible de charger le calendrier';out.innerHTML='<div class="notice">Les données sont momentanément indisponibles. Consultez les sources officielles ci-dessous.</div>'}}load();</script></body></html>
